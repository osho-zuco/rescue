name: rescue_core
description: Shared Flutter package for Pet Rescue app
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^8.0.0
  injectable: ^2.4.0

  # Networking
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0

  # Routing
  go_router: ^14.2.0

  # Utils
  intl: ^0.20.0
  rxdart: ^0.28.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Location services
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_places_flutter: ^2.1.1
  google_maps_flutter: ^2.5.0
  package_info_plus: ^8.0.3

  # Firebase
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.5.0
  flutter_local_notifications: ^18.0.1

  # Analytics
  mixpanel_flutter: ^2.3.2

  # Image viewer
  photo_view: ^0.15.0
  sentry_flutter: ^9.9.2
  pinput: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  injectable_generator: ^2.6.0
  build_runner: ^2.4.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
